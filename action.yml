name: 'Cache Wrt Build'
description: 'Cache builds to speed up openwrt compilation'
inputs:
  ccache:
    description: 'check if to cache ccache'
    required: false
    default: 'false'
  toolchain:
    description: 'check if to cache toolchain'
    required: false
    default: 'true'
  skip:
    description: 'check if to skip the compilation of toolchain'
    required: false
    default: 'true'
  clean:
    description: 'set to clean cache'
    required: false
    default: 'false'
  prefix:
    description: 'path prefix to openwrt build directory'
    required: false
    default: ''
  mixkey:
    description: 'mix a key to identify a cache when you build openwrt for different architecture'
    required: false
    default: ''
  skip_saving:
    description: 'skip saving'
    required: false
    default: 'false'
  save_on_failure:
    description: >-
      legacy/no-op placeholder — post-if 里读不到 action inputs；
      请改用作业级环境变量 CACHEWRT_SAVE_ON_FAILURE=true（见 README）
    required: false
    default: 'false'
  extra_paths:
    description: 'additional cache directories to include (one per line, can specify multiple)'
    required: false
    default: ''
outputs:
  hit:
    description: 'indicate cache found'
runs:
  using: 'node24'
  main: 'fetch.js'
  post: 'save.js'
  # 默认只在 job 成功时保存；设置作业级环境变量 CACHEWRT_SAVE_ON_FAILURE=true 后，
  # 编译失败（failure）也会执行 post 保存。注意：post-if 里读不到 action inputs，
  # 所以开关必须是 env，不能是 with: 输入。
  post-if: "success() || (failure() && env.CACHEWRT_SAVE_ON_FAILURE == 'true')"
branding:
  icon: 'archive'
  color: 'gray-dark'
